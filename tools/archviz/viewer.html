<script>
"use strict";
const DATA = /*__SNAPSHOT__*/null;
const NS="http://www.w3.org/2000/svg";
const KINDS={user:"User request",http:"Internal HTTP",db:"SQL",metric:"Metrics",file:"Volume I/O",config:"Config / Secret",probe:"Health probes",control:"kubectl / port-forward"};
const DEFAULT_OFF=new Set(["config","probe","control"]);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a||{})e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function tx(p,x,y,s,c,anc){const t=el("text",{x,y,class:c||"","text-anchor":anc||"start"},p);t.textContent=s;return t;}

if(!DATA){document.body.innerHTML="<p style='padding:30px'>This is the template. Run <code>python tools/archviz/snapshot.py</code> to generate <code>architecture.html</code>.</p>";throw new Error("no data");}

/* ───────── index everything ───────── */
const ENT={};             // id → {id,name,type,group,obj}
DATA.externals.forEach(e=>ENT[e.id]={id:e.id,name:e.name,type:"external",group:"external",obj:e});
DATA.components.forEach(c=>ENT[c.id]={id:c.id,name:c.name,type:"component",group:c.group,obj:c});
DATA.pvcs.forEach(p=>ENT[p.id]={id:p.id,name:p.name,type:"pvc",group:"storage",obj:p});
DATA.configs.forEach(c=>ENT[c.id]={id:c.id,name:c.name,type:"config",group:"config",obj:c});
DATA.controlPlane.forEach(c=>ENT[c.id]={id:c.id,name:c.name,type:"cp",group:"control",obj:c});
const SVC={}; DATA.services.forEach(s=>SVC[s.id]=s);
const LINK={}; DATA.links.forEach(l=>LINK[l.id]=l);
const POS=DATA.layout.positions;
function size(id){const t=ENT[id]?.type;return t==="pvc"?{w:200,h:84}:t==="external"?{w:200,h:84}:t==="cp"?{w:205,h:74}:{w:230,h:108};}
function nameOf(id){return ENT[id]?ENT[id].name:id;}

/* header */
const m=DATA.meta;
$("#sub").textContent=`namespace ${m.namespace} · generated ${m.generated}${m.repoCommit?" · "+m.repoCommit:""}`;
$("#meta").innerHTML=[
  m.live?`<span class="chip live">● live snapshot</span>`:`<span class="chip yaml">● from YAML only (no cluster)</span>`,
  m.context?`<span class="chip">context ${esc(m.context)}</span>`:"",
  m.k8sVersion?`<span class="chip">k8s ${esc(m.k8sVersion)}</span>`:"",
  m.node&&m.node.name?`<span class="chip">node ${esc(m.node.name)} · ${esc(m.node.cpu)} CPU · ${esc(m.node.memory)} · ${esc(m.node.runtime)}</span>`:"",
  `<span class="chip">${DATA.components.length} workloads · ${DATA.services.length} services · ${DATA.links.length} gates</span>`
].join("");

/* tabs */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
function showView(v){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===v)));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));}

/* ───────── MAP ───────── */
const svg=$("#map");
const defs=el("defs",{},svg);
Object.keys(KINDS).forEach(k=>{const mk=el("marker",{id:"a-"+k,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);el("path",{d:"M0,0L10,5L0,10z",class:"mk-"+k},mk);});
const gZ=el("g",{},svg), gE=el("g",{},svg), gN=el("g",{},svg), gF=el("g",{},svg);

// zones: bounding boxes per group
const GL={external:"OUTSIDE THE CLUSTER",ingress:"PUBLIC TUNNEL",serving:"SERVING",storage:"STORAGE (PVCs)",ml:"ML LIFECYCLE",observability:"OBSERVABILITY",other:"OTHER",control:"CONTROL PLANE + NODE AGENTS"};
const groups={};
Object.values(ENT).forEach(e=>{if(!POS[e.id])return;const g=e.group;(groups[g]=groups[g]||[]).push(e.id);});
Object.entries(groups).forEach(([g,ids])=>{

function border(id,tx_,ty_){const [x,y]=POS[id],s=size(id),c=center(id);const dx=tx_-c.x,dy=ty_-c.y;if(!dx&&!dy)return c;const k=Math.min(dx?(s.w/2)/Math.abs(dx):1e9,dy?(s.h/2)/Math.abs(dy):1e9);return {x:c.x+dx*k,y:c.y+dy*k};}

  const key=[src,dst].sort().join("|");const idx=pairCount[key]=(pairCount[key]||0)+1;

function reachableFromInternet(){const seen=new Set(["ext:internet"]);let ch=true;while(ch){ch=false;DATA.links.forEach(l=>{if(l.kind==="user"&&seen.has(l.src)&&!seen.has(l.dst)){seen.add(l.dst);ch=true;}});}return seen;}
const PUBLIC=reachableFromInternet();
function isolation(id){
  const e=ENT[id];if(e.type!=="component")return [];const o=e.obj,out=[];
  const svcs=o.services.map(s=>SVC[s]).filter(Boolean);
  out.push({t:"Namespace",s:"ok",d:`Lives in <code>${esc(DATA.meta.namespace)}</code>. Namespaces scope names, DNS (<code>&lt;svc&gt;.${esc(DATA.meta.namespace)}.svc.cluster.local</code>), RBAC and quotas. They do <b>not</b> block network traffic by themselves.`});
  out.push({t:"Own network stack",s:"ok",d:`Each pod gets its own network namespace and IP${o.pods[0]?.ip?" (e.g. "+esc(o.pods[0].ip)+")":""}; containers in the same pod share it (localhost). ${o.hostNetwork?"<b>hostNetwork: true</b> — shares the node's network!":"Not on the host network."}`});
  if(svcs.length) out.push({t:"Reachability",s:PUBLIC.has(id)?"warn":"ok",d:svcs.map(s=>`Service <code>${esc(s.name)}</code> is <b>${esc(s.type)}</b>${s.type==="ClusterIP"?" → only reachable from inside the cluster":" → exposed on the node"}.`).join(" ")+(PUBLIC.has(id)?` <b>But it IS reachable from the internet</b>, through the tunnel path (${[...PUBLIC].filter(x=>x!=="ext:internet"&&x!==id).map(nameOf).map(esc).join(" → ")}).`:"")});
  else out.push({t:"Reachability",s:"ok",d:"No Service selects these pods, so nothing can reach them by name; only by pod IP (e.g. probes, Prometheus pod discovery, port 8793 logs)."});
  out.push({t:"Network policies",s:DATA.networkPolicies.length?"ok":"bad",d:DATA.networkPolicies.length?`Policies in the namespace: ${DATA.networkPolicies.map(esc).join(", ")}.`:`<b>None in this namespace.</b> Any pod in the cluster can open a connection to this one on any port it listens on. A NetworkPolicy (e.g. "only airflow pods may reach postgres:5432") would close that.`});
  const lim=o.containers.map(c=>c.resources||{});const nolim=lim.some(r=>!r.limits||!r.limits.memory);
  out.push({t:"CPU / memory (cgroups)",s:nolim?"warn":"ok",d:o.containers.map(c=>{const r=c.resources||{};return `<code>${esc(c.name)}</code>: requests ${esc(JSON.stringify(r.requests||{}))}, limits ${esc(JSON.stringify(r.limits||{}))}`;}).join("<br>")+(nolim?"<br>No memory limit: it can use the whole node and starve others.":"<br>Over the memory limit → OOMKilled (exit 137). Requests are what the scheduler reserves.")});
  const sc=o.containers.map(c=>c.securityContext||{});const ps=o.podSecurity||{};
  const user=ps.runAsUser||sc.find(s=>s.runAsUser)?.runAsUser;
  const imgUser=o.containers.some(c=>/airflow/.test(c.image))?"the airflow image sets USER airflow (uid 50000)":/postgres|grafana|prometheus/.test(o.containers.map(c=>c.image).join())?"the official image drops to its own non-root user":"the image's default user (root unless the Dockerfile sets USER)";
  out.push({t:"Process identity",s:user||/airflow|postgres|grafana|prometheus/.test(o.containers.map(c=>c.image).join())?"ok":"warn",d:`${user?"runAsUser "+esc(user):"No securityContext set; runs as "+imgUser}. ${sc.some(s=>s.privileged)?"<b>privileged</b>":"Not privileged."} Containers get their own PID and mount namespaces: they can't see other pods' processes or files.`});
  const roles=DATA.roleBindings.filter(b=>b.subjects.includes(o.serviceAccount));
  out.push({t:"API identity (RBAC)",s:roles.length?"warn":"ok",d:`ServiceAccount <code>${esc(o.serviceAccount)}</code>; token ${o.automountToken===false?"not mounted":"auto-mounted at /var/run/secrets/kubernetes.io"}. ${roles.length?"Bound to Role(s): "+roles.map(r=>esc(r.role)).join(", ")+": it may call the API server with those rights.":"No Role bound: the token can do almost nothing."}`});
  out.push({t:"Filesystem",s:"ok",d:o.mounts.length?o.mounts.map(mt=>`<code>${esc(mt.path)}</code> ${mt.readOnly?"read-only":"read-write"}`).join(", ")+". Everything else it writes is lost when the container restarts.":"No volumes: fully ephemeral."});
  if(o.secretRefs.length) out.push({t:"Secrets it receives",s:"warn",d:`${o.secretRefs.map(esc).join(", ")} as env vars. Visible to anything that can exec into the pod or read the Secret via RBAC.`});
  return out;
}

/* ───────── GATE drawer ───────── */
$("#dClose").onclick=()=>drawer.classList.remove("on");
function openGate(lid){
  const l=LINK[lid];if(!l)return;
  $("#dTitle").textContent=`${nameOf(l.src)} → ${nameOf(l.dst)}`;
  const via=l.via&&SVC[l.via]?SVC[l.via]:null;
  $("#dChips").innerHTML=[KINDS[l.kind],l.proto,l.port?"port "+l.port:"",via?`via Service ${via.name} (${via.type})`:"",l.mode?(l.mode==="ro"?"read-only":"read-write"):""].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  const isoNotes=[];
  if(via){isoNotes.push(`Service <b>${esc(via.type)}</b> ${esc(via.name)} → ${via.type==="ClusterIP"?"only callable from inside the cluster":"exposed outside the cluster"}. DNS <code>${esc(via.dns)}</code>, ClusterIP <code>${esc(via.clusterIP)}</code>.`);
    if(via.ready.length) isoNotes.push(`Ready endpoints right now: ${via.ready.map(r=>`<code>${esc(r.pod)} ${esc(r.ip)}</code>`).join(", ")}${via.notReady.length?`; NOT ready (no traffic): ${via.notReady.map(r=>`<code>${esc(r.pod)}</code>`).join(", ")}`:""}.`);}
  if(["user","http","db","metric"].includes(l.kind)) isoNotes.push(DATA.networkPolicies.length?"NetworkPolicies exist in this namespace; check they allow this.":"No NetworkPolicy guards this gate: <b>any</b> pod in the cluster could open the same connection.");
  if(l.kind==="file") isoNotes.push(`Access is decided by the mount: ${l.mode==="ro"?"<b>readOnly: true</b>, so writes fail with EROFS":"read-write"}. Files are shared by every pod mounting this PVC; there are no per-pod permissions beyond Unix file modes.`);
  if(l.kind==="config") isoNotes.push("The kubelet fetches it from the API server, only for pods scheduled on its own node.");
  if(l.kind==="probe") isoNotes.push("Probes come from the node (kubelet) to the pod IP. They bypass the Service and any tunnel.");
  if(l.src==="ext:edge"||l.src==="ext:internet") isoNotes.push("The only path from the internet into the cluster. Nothing listens on your laptop's network; the tunnel agent dialled out.");
  const routes=l.routes?`<h4>Routes through this gate</h4><pre class="pl">${l.routes.map(r=>`${(r.method||"?").padEnd(6)} ${r.path.padEnd(10)} → handler ${r.handler}`).join("\n")}</pre>`:"";
  $("#dBody").innerHTML=`<h4>What travels through it</h4><pre class="pl">${esc(l.payload)}</pre>${routes}
    <h4>Route, hop by hop</h4><ol class="hops">${(l.hops||[]).map(h=>`<li><b>${esc(h.at)}</b><br>${esc(h.text)}</li>`).join("")||"<li>direct</li>"}</ol>
    <h4>Defined by (evidence)</h4><ul class="ev">${l.evidence.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h4>Isolation at this gate</h4><ul class="ev" style="font-family:var(--sans);font-size:13px">${isoNotes.map(x=>`<li>${x}</li>`).join("")||"<li>-</li>"}</ul>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="big" onclick="gateOnMap('${l.id}')">Play on map</button>
      ${ENT[l.src]&&l.src!==roomId?`<button class="ghost" onclick="openRoom('${esc(l.src)}')">Enter ${esc(nameOf(l.src))}</button>`:""}
      ${ENT[l.dst]&&l.dst!==roomId?`<button class="ghost" onclick="openRoom('${esc(l.dst)}')">Enter ${esc(nameOf(l.dst))}</button>`:""}
    </div>`;
  drawer.classList.add("on");$("#dClose").focus();
}
window.openGate=openGate;
function gateOnMap(lid){closeRoom();showView("mapView");const l=LINK[lid];const kind=l.kind;unhide(kind);focusLink(lid);if(POS[l.src])panTo(l.src);animate(lid,false);}
window.gateOnMap=gateOnMap;
function unhide(kind){if(svg.classList.contains("hide-"+kind)){svg.classList.remove("hide-"+kind);const b=[...fbox.children].find(b=>b.style.color===`var(--${kind})`);if(b)b.setAttribute("aria-pressed","true");}}

/* ───────── animation along a gate ───────── */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim=null;
function animate(lid,reverse,done){
  const path=EDGE[lid];if(!path){done&&done();return;}
  if(anim)cancelAnimationFrame(anim.raf),anim.dot.remove();
  const L=path.getTotalLength();const dot=el("circle",{r:8,class:"flowdot"},gF);
  if(reduce){const p=path.getPointAtLength(reverse?0:L);dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);anim={dot,raf:0};done&&setTimeout(done,600);return;}
  const t0=performance.now(),dur=1300;
  const step=t=>{const k=Math.min(1,(t-t0)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const p=path.getPointAtLength((reverse?1-e:e)*L);dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);if(k<1)anim.raf=requestAnimationFrame(step);else{done&&done();}};
  anim={dot,raf:requestAnimationFrame(step)};
}

/* ───────── SCENARIOS ───────── */
let flow=null,fi=0,auto=null;
$("#flowList").innerHTML=`<div><div class="sec-title">Scenarios</div><p class="sec-sub">Each one plays on the map, gate by gate. Use Prev/Next or Play; "Open room" jumps into the component at the current step.</p></div>`+
  DATA.flows.map(f=>`<div class="lcard"><h3>${esc(f.title)}</h3><ol>${f.steps.map(s=>`<li>${esc(s.text)}</li>`).join("")}</ol><button class="big" onclick="startFlow('${f.id}')">▶ Play on the map</button></div>`).join("");
function startFlow(id){flow=DATA.flows.find(f=>f.id===id);fi=0;showView("mapView");fit();$("#player").classList.add("on");$("#pTitle").textContent=flow.title;renderStep();}
window.startFlow=startFlow;
function renderStep(){
  const s=flow.steps[fi];$("#pNum").textContent=`step ${fi+1} / ${flow.steps.length}`;$("#pText").textContent=s.text;$("#pBar").style.width=((fi+1)/flow.steps.length*100)+"%";
  clearFocus();
  if(s.link&&LINK[s.link]){const l=LINK[s.link];unhide(l.kind);focusLink(s.link);animate(s.link,s.reverse);$("#pRoom").disabled=false;$("#pRoom").onclick=()=>openRoom(s.reverse?l.src:l.dst);}
  else if(s.node){svg.classList.add("focus");svg.querySelector(`.node[data-id="${CSS.escape(s.node)}"]`)?.classList.add("pulse");$("#pRoom").disabled=!ENT[s.node];$("#pRoom").onclick=()=>openRoom(s.node);}
}
$("#pNext").onclick=()=>{if(fi<flow.steps.length-1){fi++;renderStep();}else stopAuto();};
$("#pPrev").onclick=()=>{if(fi>0){fi--;renderStep();}};
$("#pClose").onclick=()=>{stopAuto();$("#player").classList.remove("on");clearFocus();if(anim)anim.dot.remove();};
$("#pPlay").onclick=()=>{if(auto){stopAuto();return;}$("#pPlay").textContent="❚❚ Pause";auto=setInterval(()=>{if(fi<flow.steps.length-1){fi++;renderStep();}else stopAuto();},2600);};
function stopAuto(){clearInterval(auto);auto=null;$("#pPlay").textContent="▶ Play";}

/* ───────── INTERVIEW ───────── */
$("#qaList").innerHTML=`<div><div class="sec-title">Interview questions</div><p class="sec-sub">Answer out loud first, then open the answer and press "Show me" to see it in your own system.</p></div>`+
  DATA.questions.map((q,i)=>`<div class="lcard"><details${i===0?" open":""}><summary>${esc(q.q)}</summary><div class="ans">${esc(q.a)}</div>
    ${q.show?`<button class="big" onclick='showMe(${JSON.stringify(q.show)})'>Show me ${q.show.flow?"(play scenario)":"(open room)"}</button>`:""}</details></div>`).join("");
function showMe(s){if(s.flow)startFlow(s.flow);else if(s.room){showView("mapView");openRoom(s.room);}else if(s.gate){openGate(s.gate);}}
window.showMe=showMe;

/* deep links: architecture.html#room=backend-deployment · #gate=L12 · #flow=predict */
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const [k,v]=h.split("=");
  if(k==="room"&&ENT[v])openRoom(v); else if(k==="gate"&&LINK[v])openGate(v); else if(k==="flow")startFlow(v);}
fromHash();
</script>
</body>
