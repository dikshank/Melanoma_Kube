  <h1>Melanoma Kube · architecture snapshot<small id="sub"></small></h1>
  <div class="meta" id="meta"></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="mapView">Map</button>
    <button role="tab" aria-selected="false" data-view="flowView">Scenarios</button>
    <button role="tab" aria-selected="false" data-view="qaView">Interview</button>
  </div>
</header>

<section class="view on" id="mapView">
  <div id="mapWrap">
    <div class="filters" id="filters" aria-label="Show or hide gate types"></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to screen">⤢</button><button id="zanim" aria-label="Animate traffic" aria-pressed="true" title="Animate traffic (request ● / answer ○)">●○</button></div>
    <svg id="map" role="img" aria-label="Map of every component, volume and connection"></svg>
    <div class="hint">● solid line = request · ○ thin line = answer coming back · ✕ = no reply (UDP) · Drag to pan · scroll to zoom · click a box for details · double-click to enter its room · click a line to open that gate</div>
    <div class="player" id="player" aria-live="polite">
      <div class="row"><span class="t" id="pTitle"></span><span class="n" id="pNum"></span><div class="bar"><i id="pBar"></i></div>
        <button class="ghost" id="pPrev">◀ Prev</button><button class="ghost" id="pPlay">▶ Play</button><button class="ghost" id="pNext">Next ▶</button><button class="ghost" id="pRoom">Open room</button><button class="ghost" id="pClose">✕</button></div>
      <p id="pText"></p>
    </div>
  </div>
  <aside class="side" id="side"></aside>
</section>

<section class="view listView" id="flowView"><div class="inner" id="flowList"></div></section>
<section class="view listView" id="qaView"><div class="inner" id="qaList"></div></section>

<div class="room" id="room" role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="rhead">
    <button class="ghost" id="rBack">← Map</button>
    <div><div class="crumb" id="rCrumb"></div><h2 id="rTitle"></h2></div>
    <div style="margin-left:auto;display:flex;gap:8px" id="rActions"></div>
  </div>
  <div class="rbody" id="rBody"></div>
</div>
<div id="tip" class="tip" role="tooltip"></div>
<aside class="drawer" id="drawer" aria-live="polite">
  <div class="dhead"><div style="display:flex;gap:8px;align-items:center"><h3 id="dTitle" style="flex:1"></h3><button class="ghost" id="dClose">✕</button></div><div id="dChips" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"></div></div>
  <div class="dbody" id="dBody"></div>
</aside>

<script>
"use strict";
const DATA = /*__SNAPSHOT__*/null;
const NS="http://www.w3.org/2000/svg";
const KINDS={user:"User request",http:"Internal HTTP",db:"SQL",metric:"Metrics",file:"Volume I/O",config:"Config / Secret",probe:"Health probes",control:"kubectl / port-forward"};
const DEFAULT_OFF=new Set(["config","probe","control"]);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a||{})e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function tx(p,x,y,s,c,anc){const t=el("text",{x,y,class:c||"","text-anchor":anc||"start"},p);t.textContent=s;return t;}

if(!DATA){document.body.innerHTML="<p style='padding:30px'>This is the template. Run <code>python tools/archviz/snapshot.py</code> to generate <code>architecture.html</code>.</p>";throw new Error("no data");}

/* ───────── index everything ───────── */
const ENT={};             // id → {id,name,type,group,obj}
DATA.externals.forEach(e=>ENT[e.id]={id:e.id,name:e.name,type:"external",group:"external",obj:e});
DATA.components.forEach(c=>ENT[c.id]={id:c.id,name:c.name,type:"component",group:c.group,obj:c});
DATA.pvcs.forEach(p=>ENT[p.id]={id:p.id,name:p.name,type:"pvc",group:"storage",obj:p});
DATA.configs.forEach(c=>ENT[c.id]={id:c.id,name:c.name,type:"config",group:"config",obj:c});
DATA.controlPlane.forEach(c=>ENT[c.id]={id:c.id,name:c.name,type:"cp",group:"control",obj:c});
const SVC={}; DATA.services.forEach(s=>SVC[s.id]=s);
const LINK={}; DATA.links.forEach(l=>LINK[l.id]=l);
const POS=DATA.layout.positions;
function size(id){const t=ENT[id]?.type;return t==="pvc"?{w:200,h:84}:t==="external"?{w:200,h:84}:t==="cp"?{w:205,h:74}:{w:230,h:108};}
function nameOf(id){return ENT[id]?ENT[id].name:id;}

/* header */
const m=DATA.meta;
$("#sub").textContent=`namespace ${m.namespace} · generated ${m.generated}${m.repoCommit?" · "+m.repoCommit:""}`;
$("#meta").innerHTML=[
  m.live?`<span class="chip live">● live snapshot</span>`:`<span class="chip yaml">● from YAML only (no cluster)</span>`,
  m.context?`<span class="chip">context ${esc(m.context)}</span>`:"",
  m.k8sVersion?`<span class="chip">k8s ${esc(m.k8sVersion)}</span>`:"",
  m.node&&m.node.name?`<span class="chip">node ${esc(m.node.name)} · ${esc(m.node.cpu)} CPU · ${esc(m.node.memory)} · ${esc(m.node.runtime)}</span>`:"",
  `<span class="chip">${DATA.components.length} workloads · ${DATA.services.length} services · ${DATA.links.length} gates</span>`
].join("");

/* tabs */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
function showView(v){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===v)));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));}

/* ───────── MAP ───────── */
const svg=$("#map");
const defs=el("defs",{},svg);
Object.keys(KINDS).forEach(k=>{const mr=el("marker",{id:"r-"+k,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"6",markerHeight:"6",orient:"auto-start-reverse"},defs);el("path",{d:"M0,0L10,5L0,10z",class:"mkr-"+k},mr);});
Object.keys(KINDS).forEach(k=>{const mk=el("marker",{id:"a-"+k,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);el("path",{d:"M0,0L10,5L0,10z",class:"mk-"+k},mk);});
const gZ=el("g",{},svg), gE=el("g",{},svg), gN=el("g",{},svg), gF=el("g",{},svg);

// zones: bounding boxes per group
const GL={external:"OUTSIDE THE CLUSTER",ingress:"PUBLIC TUNNEL",serving:"SERVING",storage:"STORAGE (PVCs)",ml:"ML LIFECYCLE",observability:"OBSERVABILITY",other:"OTHER",control:"CONTROL PLANE + NODE AGENTS"};
const groups={};
Object.values(ENT).forEach(e=>{if(!POS[e.id])return;const g=e.group;(groups[g]=groups[g]||[]).push(e.id);});
Object.entries(groups).forEach(([g,ids])=>{
  if(!["external","control"].includes(g))return; // other groups are shown as a coloured stripe on each card
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;ids.forEach(id=>{const [x,y]=POS[id],s=size(id);x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x+s.w);y2=Math.max(y2,y+s.h);});
  const z=el("g",{class:"zone"},gZ);el("rect",{x:x1-18,y:y1-34,width:x2-x1+36,height:y2-y1+52,rx:16,style:`fill:var(--g-${g})`},z);tx(z,x1-6,y1-14,GL[g]||g.toUpperCase());
});
// namespace frame
(function(){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;Object.values(ENT).forEach(e=>{if(!POS[e.id]||["external","cp","config"].includes(e.type))return;const [x,y]=POS[e.id],s=size(e.id);x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x+s.w);y2=Math.max(y2,y+s.h);});
  const z=el("g",{class:"zone"},gZ);el("rect",{x:x1-34,y:y1-66,width:x2-x1+68,height:y2-y1+96,rx:20,style:"fill:none;stroke:var(--muted);stroke-dasharray:8 6;stroke-width:1.4"},z);tx(z,x1-22,y1-46,"namespace: "+DATA.meta.namespace);})();

// nodes
function drawNode(id){
  const e=ENT[id];if(!POS[id])return;const [x,y]=POS[id],s=size(id);
  const g=el("g",{class:"node t-"+e.type,"data-id":id,tabindex:"0",role:"button","aria-label":e.name},gN);
  if(e.type==="pvc"){const r=8;el("path",{class:"card",d:`M${x},${y+r}A${s.w/2},${r} 0 0 1 ${x+s.w},${y+r}L${x+s.w},${y+s.h-r}A${s.w/2},${r} 0 0 1 ${x},${y+s.h-r}Z`},g);el("path",{class:"card",style:"fill:none",d:`M${x},${y+r}A${s.w/2},${r} 0 0 0 ${x+s.w},${y+r}`},g);}
  else el("rect",{class:"card",x,y,width:s.w,height:s.h,rx:e.type==="external"?12:8},g);
  if(e.type==="component"||e.type==="pvc") el("rect",{x:x+1,y:y+(e.type==="pvc"?8:1),width:5,height:s.h-(e.type==="pvc"?16:2),rx:2,style:`fill:var(--c-${e.group})`},g);
  const cx=x+12;let ty=y+(e.type==="pvc"?28:18);
  const o=e.obj;
  const kind=e.type==="component"?o.kind.toUpperCase():e.type==="pvc"?"PVC":e.type==="cp"?"CONTROL PLANE":"EXTERNAL";
  tx(g,cx,ty,kind,"kind");ty+=17;
  tx(g,cx,ty,trunc(e.name,26),"nm");ty+=16;
  if(e.type==="component"){
    const img=(o.containers[0]||{}).image||"";
    const rep=o.kind==="Job"?(o.jobStatus?`Job · ${o.jobStatus.succeeded?"Completed":"not completed"}`:"Job"):`×${o.replicas??1}`+(o.readyReplicas!=null?` · ${o.readyReplicas}/${o.replicas} ready`:"");
    tx(g,cx,ty,rep,"s1");ty+=14;tx(g,cx,ty,trunc(img,32),"s1");
    // pod dots
    const n=o.kind==="Job"?Math.max(1,o.pods.length):(o.replicas||1);
    for(let i=0;i<n;i++){const p=o.pods[i];const cls=!p?"dot-off":(p.ready||p.phase==="Succeeded")?"dot-ok":p.phase==="Running"?"dot-warn":"dot-bad";const c=el("circle",{cx:x+s.w-14-i*14,cy:y+16,r:5,class:cls},g);const t=el("title",{},c);t.textContent=p?`${p.name} · ${p.ip||"no IP"} · ${p.phase}${p.restarts?" · "+p.restarts+" restarts":""}`:"pod (not live)";}
    // service doors
    o.services.forEach((sid,i)=>{const sv=SVC[sid];if(!sv)return;const label=`svc ${sv.name}:${sv.ports.map(p=>p.port).join(",")}`;const w=Math.min(s.w-16,label.length*6.3+12);const d=el("g",{class:"door"},g);el("rect",{x:x+8,y:y+s.h-22-i*20,width:w,height:17,rx:8},d);tx(d,x+14,y+s.h-10-i*20,label);});
  } else if(e.type==="pvc"){tx(g,cx,ty,`${o.size} · ${(o.access||[]).join(",")} · ${o.phase}`,"s1");}
  else if(e.type==="cp"){tx(g,cx,ty,o.pods.length?trunc(o.pods[0].pod,30):"(node process)","s1");}
  else {tx(g,cx,ty,trunc(o.what,34),"s1");}
}
function trunc(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s;}
Object.keys(ENT).forEach(drawNode);

// edges
function center(id){const [x,y]=POS[id],s=size(id);return {x:x+s.w/2,y:y+s.h/2};}
function border(id,tx_,ty_){const [x,y]=POS[id],s=size(id),c=center(id);const dx=tx_-c.x,dy=ty_-c.y;if(!dx&&!dy)return c;const k=Math.min(dx?(s.w/2)/Math.abs(dx):1e9,dy?(s.h/2)/Math.abs(dy):1e9);return {x:c.x+dx*k,y:c.y+dy*k};}
const pairCount={};
const EDGE={};
DATA.links.forEach(l=>{
  let src=l.src,dst=l.dst;
  // ConfigMaps/Secrets have no position: their gates show up inside the rooms only
  if(!POS[src]||!POS[dst])return;
  const key=[src,dst].sort().join("|");const idx=pairCount[key]=(pairCount[key]||0)+1;
  const a=center(src),b=center(dst);const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
  const bend=(idx-1)*28*(idx%2?1:-1)+(l.kind==="probe"?40:0);
  const cx=(a.x+b.x)/2-dy/L*bend,cy=(a.y+b.y)/2+dx/L*bend;
  const p1=border(src,cx,cy),p2=border(dst,cx,cy);
  const g=el("g",{class:"edge k-"+l.kind,"data-id":l.id,"data-src":src,"data-dst":dst},gE);
  const d=`M${p1.x},${p1.y}Q${cx},${cy} ${p2.x},${p2.y}`;
  const ln=el("path",{class:"ln",id:"mE"+l.id,d,"marker-end":`url(#a-${l.kind})`},g);
  // the answer: a thin lane beside the request, arrow pointing back to the caller
  const nx=-(p2.y-p1.y),ny=(p2.x-p1.x),nl=Math.hypot(nx,ny)||1,o=7,ox=nx/nl*o,oy=ny/nl*o;
  if(!l.oneWay&&!(l.kind==="file"&&l.mode==="ro")){
    const d2=`M${p2.x+ox},${p2.y+oy}Q${cx+ox},${cy+oy} ${p1.x+ox},${p1.y+oy}`;
    el("path",{class:"ret",id:"mR"+l.id,d:d2,"marker-end":`url(#r-${l.kind})`},g);
    const ap=el("circle",{r:4,class:"apk req"},g);const a1=el("animateMotion",{dur:"2.6s",repeatCount:"indefinite"},ap);el("mpath",{href:"#mE"+l.id},a1);
    const rp=el("circle",{r:3.6,class:"apk rsp"},g);const a2=el("animateMotion",{dur:"2.6s",begin:"1.3s",repeatCount:"indefinite"},rp);el("mpath",{href:"#mR"+l.id},a2);
  } else if(l.oneWay&&l.kind!=="config"){
    tx(g,p1.x+(p2.x-p1.x)*.12+ox*2,p1.y+(p2.y-p1.y)*.12+oy*2+4,"✕","noreply","middle");
    const ap=el("circle",{r:4,class:"apk req"},g);const a1=el("animateMotion",{dur:"2.6s",repeatCount:"indefinite"},ap);el("mpath",{href:"#mE"+l.id},a1);
  } else {
    const ap=el("circle",{r:4,class:"apk req"},g);const a1=el("animateMotion",{dur:"2.6s",repeatCount:"indefinite",keyPoints:l.kind==="file"&&l.mode==="ro"?"1;0":"0;1",keyTimes:"0;1",calcMode:"linear"},ap);el("mpath",{href:"#mE"+l.id},a1);
  }
  el("path",{class:"hit",d},g);
  const srcObj=ENT[l.src]?.obj, npods=srcObj&&srcObj.pods?(srcObj.pods.length||srcObj.replicas||1):1;
  if(l.kind==="file"&&npods>1){const lx=.25*p1.x+.5*cx+.25*p2.x,ly=.25*p1.y+.5*cy+.25*p2.y;const s=`×${npods} pods ${l.mode==="ro"?"ro":"rw"}`;const w=s.length*5.7+10;el("rect",{class:"lb",x:lx-w/2,y:ly-8,width:w,height:15,rx:4},g);tx(g,lx,ly+3.5,s,"","middle");}
  if(["user","http","db","metric"].includes(l.kind)){const lx=.25*p1.x+.5*cx+.25*p2.x,ly=.25*p1.y+.5*cy+.25*p2.y;const s=trunc(l.label,30);const w=s.length*5.7+10;el("rect",{class:"lb",x:lx-w/2,y:ly-8,width:w,height:15,rx:4},g);tx(g,lx,ly+3.5,s,"","middle");}
  const t=el("title",{},g);t.textContent=`${nameOf(l.src)} → ${nameOf(l.dst)} · ${l.proto}${l.port?" :"+l.port:""}`;
  EDGE[l.id]=ln;
});

// filters
const fbox=$("#filters");
Object.entries(KINDS).forEach(([k,label])=>{const b=document.createElement("button");b.className="fchip";b.style.color=`var(--${k})`;b.innerHTML=`<i></i><span style="color:var(--ink)">${label}</span>`;b.setAttribute("aria-pressed",String(!DEFAULT_OFF.has(k)));if(DEFAULT_OFF.has(k))svg.classList.add("hide-"+k);b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",String(on));svg.classList.toggle("hide-"+k,!on);};fbox.appendChild(b);});

/* pan / zoom */
const W=DATA.layout.width,H=DATA.layout.height;let vb={x:0,y:0,w:W,h:H};
function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}
function fit(){vb={x:-20,y:-20,w:W+40,h:H+40};setVB();}
fit();
function zoomAt(f,px,py){const r=svg.getBoundingClientRect();const sx=vb.x+(px-r.left)/r.width*vb.w,sy=vb.y+(py-r.top)/r.height*vb.h;vb.w*=f;vb.h*=f;vb.x=sx-(px-r.left)/r.width*vb.w;vb.y=sy-(py-r.top)/r.height*vb.h;setVB();}
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.12:1/1.12,e.clientX,e.clientY);},{passive:false});
$("#zin").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.25,r.left+r.width/2,r.top+r.height/2);};
$("#zout").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.25,r.left+r.width/2,r.top+r.height/2);};
$("#zfit").onclick=fit;
const zanim=$("#zanim");
function setAnim(on){zanim.setAttribute("aria-pressed",String(on));svg.classList.toggle("noanim",!on);on?svg.unpauseAnimations():svg.pauseAnimations();}
zanim.onclick=()=>setAnim(zanim.getAttribute("aria-pressed")!=="true");
if(matchMedia("(prefers-reduced-motion: reduce)").matches)setAnim(false);
let drag=null,moved=false;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vb:{...vb}};moved=false;});
window.addEventListener("pointermove",e=>{if(!drag)return;const r=svg.getBoundingClientRect();const dx=(e.clientX-drag.x)/r.width*vb.w,dy=(e.clientY-drag.y)/r.height*vb.h;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4){moved=true;$("#mapWrap").classList.add("drag");}vb.x=drag.vb.x-dx;vb.y=drag.vb.y-dy;setVB();});
window.addEventListener("pointerup",()=>{drag=null;$("#mapWrap").classList.remove("drag");});
function panTo(id){if(!POS[id])return;const c=center(id);vb.x=c.x-vb.w/2;vb.y=c.y-vb.h/2;setVB();}

/* selection + side panel */
function clearFocus(){svg.classList.remove("focus");svg.querySelectorAll(".sel,.nb,.hot,.pulse").forEach(n=>n.classList.remove("sel","nb","hot","pulse"));}
function focusNode(id){clearFocus();svg.classList.add("focus");const n=svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`);if(n)n.classList.add("sel");
  svg.querySelectorAll(".edge").forEach(e=>{if(e.dataset.src===id||e.dataset.dst===id){e.classList.add("hot");const o=e.dataset.src===id?e.dataset.dst:e.dataset.src;svg.querySelector(`.node[data-id="${CSS.escape(o)}"]`)?.classList.add("nb");}});}
function focusLink(lid){clearFocus();svg.classList.add("focus");const l=LINK[lid];const e=svg.querySelector(`.edge[data-id="${lid}"]`);if(e)e.classList.add("hot");[l.src,l.dst].forEach(id=>svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`)?.classList.add("nb"));}
svg.addEventListener("click",e=>{if(moved)return;const n=e.target.closest(".node"),ed=e.target.closest(".edge");if(n){focusNode(n.dataset.id);side(n.dataset.id);}else if(ed){focusLink(ed.dataset.id);openGate(ed.dataset.id);}else{clearFocus();sideDefault();}});
svg.addEventListener("dblclick",e=>{const n=e.target.closest(".node");if(n)openRoom(n.dataset.id);});
svg.addEventListener("keydown",e=>{const n=e.target.closest(".node");if(!n)return;if(e.key==="Enter")openRoom(n.dataset.id);if(e.key===" "){e.preventDefault();focusNode(n.dataset.id);side(n.dataset.id);}});

function gatesOf(id){return {inc:DATA.links.filter(l=>l.dst===id),out:DATA.links.filter(l=>l.src===id)};}
function sideDefault(){
  const m=DATA.meta;
  $("#side").innerHTML=`<div class="k">How to use this snapshot</div><h2>Click a box, then enter its room</h2>
  <p>Each box is a real object from your cluster. Lines are <b>gates</b>: one connection, with a direction (caller → callee), a port and a protocol.</p>
  <p><b>Double-click</b> a box (or select it and press <b>Enter room</b>) to see its incoming gates, outgoing gates and the walls that isolate it. Click any gate to see exactly what would travel through it and the route it takes.</p>
  <p><b>Scenarios</b> plays requests through the map step by step. <b>Interview</b> has the questions, each with a "Show me".</p>
  <p><span style="color:var(--c-ingress)">■</span> public tunnel &nbsp; <span style="color:var(--c-serving)">■</span> serving &nbsp; <span style="color:var(--c-ml)">■</span> ML lifecycle &nbsp; <span style="color:var(--c-observability)">■</span> observability &nbsp; <span style="color:var(--c-storage)">■</span> storage: the stripe on each card</p>
  <p class="mono">Health probes, config injection and kubectl lines are hidden by default: turn them on with the chips.</p>
  ${m.node&&m.node.name?`<div class="k" style="margin-top:14px">The node</div><dl class="kv"><dt>name</dt><dd>${esc(m.node.name)} (${esc(m.node.ip)})</dd><dt>capacity</dt><dd>${esc(m.node.cpu)} CPU · ${esc(m.node.memory)}</dd><dt>runtime</dt><dd>${esc(m.node.runtime)}</dd><dt>pod CIDR</dt><dd>${esc(m.node.podCIDR)}</dd><dt>OS</dt><dd>${esc(m.node.os)}</dd></dl>`:""}`;
}
function side(id){
  const e=ENT[id],o=e.obj,{inc,out}=gatesOf(id);
  let h=`<div class="k">${esc(e.type==="component"?o.kind:e.type==="pvc"?"PersistentVolumeClaim":e.type==="cp"?"Control plane":"Outside the cluster")}</div><h2>${esc(e.name)}</h2><p>${esc(o.what||o.contents||"")}</p>

function drawComponentRoom(svg,id,o,inc,out){

/* isolation analysis: the "walls" */
function reachableFromInternet(){const seen=new Set(["ext:internet"]);let ch=true;while(ch){ch=false;DATA.links.forEach(l=>{if(l.kind==="user"&&seen.has(l.src)&&!seen.has(l.dst)){seen.add(l.dst);ch=true;}});}return seen;}
const PUBLIC=reachableFromInternet();
function isolation(id){
  const e=ENT[id];if(e.type!=="component")return [];const o=e.obj,out=[];
  const svcs=o.services.map(s=>SVC[s]).filter(Boolean);
  out.push({t:"Namespace",s:"ok",d:`Lives in <code>${esc(DATA.meta.namespace)}</code>. Namespaces scope names, DNS (<code>&lt;svc&gt;.${esc(DATA.meta.namespace)}.svc.cluster.local</code>), RBAC and quotas. They do <b>not</b> block network traffic by themselves.`});
  out.push({t:"Own network stack",s:"ok",d:`Each pod gets its own network namespace and IP${o.pods[0]?.ip?" (e.g. "+esc(o.pods[0].ip)+")":""}; containers in the same pod share it (localhost). ${o.hostNetwork?"<b>hostNetwork: true</b> — shares the node's network!":"Not on the host network."}`});
  if(svcs.length) out.push({t:"Reachability",s:PUBLIC.has(id)?"warn":"ok",d:svcs.map(s=>`Service <code>${esc(s.name)}</code> is <b>${esc(s.type)}</b>${s.type==="ClusterIP"?" → only reachable from inside the cluster":" → exposed on the node"}.`).join(" ")+(PUBLIC.has(id)?` <b>But it IS reachable from the internet</b>, through the tunnel path (${[...PUBLIC].filter(x=>x!=="ext:internet"&&x!==id).map(nameOf).map(esc).join(" → ")}).`:"")});
  else out.push({t:"Reachability",s:"ok",d:"No Service selects these pods, so nothing can reach them by name; only by pod IP (e.g. probes, Prometheus pod discovery, port 8793 logs)."});
  out.push({t:"Network policies",s:DATA.networkPolicies.length?"ok":"bad",d:DATA.networkPolicies.length?`Policies in the namespace: ${DATA.networkPolicies.map(esc).join(", ")}.`:`<b>None in this namespace.</b> Any pod in the cluster can open a connection to this one on any port it listens on. A NetworkPolicy (e.g. "only airflow pods may reach postgres:5432") would close that.`});
  const lim=o.containers.map(c=>c.resources||{});const nolim=lim.some(r=>!r.limits||!r.limits.memory);
  out.push({t:"CPU / memory (cgroups)",s:nolim?"warn":"ok",d:o.containers.map(c=>{const r=c.resources||{};return `<code>${esc(c.name)}</code>: requests ${esc(JSON.stringify(r.requests||{}))}, limits ${esc(JSON.stringify(r.limits||{}))}`;}).join("<br>")+(nolim?"<br>No memory limit: it can use the whole node and starve others.":"<br>Over the memory limit → OOMKilled (exit 137). Requests are what the scheduler reserves.")});
  const sc=o.containers.map(c=>c.securityContext||{});const ps=o.podSecurity||{};
  const user=ps.runAsUser||sc.find(s=>s.runAsUser)?.runAsUser;
  const imgUser=o.containers.some(c=>/airflow/.test(c.image))?"the airflow image sets USER airflow (uid 50000)":/postgres|grafana|prometheus/.test(o.containers.map(c=>c.image).join())?"the official image drops to its own non-root user":"the image's default user (root unless the Dockerfile sets USER)";
  out.push({t:"Process identity",s:user||/airflow|postgres|grafana|prometheus/.test(o.containers.map(c=>c.image).join())?"ok":"warn",d:`${user?"runAsUser "+esc(user):"No securityContext set; runs as "+imgUser}. ${sc.some(s=>s.privileged)?"<b>privileged</b>":"Not privileged."} Containers get their own PID and mount namespaces: they can't see other pods' processes or files.`});
  const roles=DATA.roleBindings.filter(b=>b.subjects.includes(o.serviceAccount));
  out.push({t:"API identity (RBAC)",s:roles.length?"warn":"ok",d:`ServiceAccount <code>${esc(o.serviceAccount)}</code>; token ${o.automountToken===false?"not mounted":"auto-mounted at /var/run/secrets/kubernetes.io"}. ${roles.length?"Bound to Role(s): "+roles.map(r=>esc(r.role)).join(", ")+": it may call the API server with those rights.":"No Role bound: the token can do almost nothing."}`});
  out.push({t:"Filesystem",s:"ok",d:o.mounts.length?o.mounts.map(mt=>`<code>${esc(mt.path)}</code> ${mt.readOnly?"read-only":"read-write"}`).join(", ")+". Everything else it writes is lost when the container restarts.":"No volumes: fully ephemeral."});
  if(o.secretRefs.length) out.push({t:"Secrets it receives",s:"warn",d:`${o.secretRefs.map(esc).join(", ")} as env vars. Visible to anything that can exec into the pod or read the Secret via RBAC.`});
  return out;
}

  if(anim)cancelAnimationFrame(anim.raf),anim.dot.remove();
  const L=path.getTotalLength();const dot=el("circle",{r:8,class:"flowdot"},gF);
  if(reduce){const p=path.getPointAtLength(reverse?0:L);dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);anim={dot,raf:0};done&&setTimeout(done,600);return;}
  const t0=performance.now(),dur=1300;
  const step=t=>{const k=Math.min(1,(t-t0)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const p=path.getPointAtLength((reverse?1-e:e)*L);dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);if(k<1)anim.raf=requestAnimationFrame(step);else{done&&done();}};
  anim={dot,raf:requestAnimationFrame(step)};
}

/* ───────── SCENARIOS ───────── */
let flow=null,fi=0,auto=null;
$("#flowList").innerHTML=`<div><div class="sec-title">Scenarios</div><p class="sec-sub">Each one plays on the map, gate by gate. Use Prev/Next or Play; "Open room" jumps into the component at the current step.</p></div>`+
  DATA.flows.map(f=>`<div class="lcard"><h3>${esc(f.title)}</h3><ol>${f.steps.map(s=>`<li>${esc(s.text)}</li>`).join("")}</ol><button class="big" onclick="startFlow('${f.id}')">▶ Play on the map</button></div>`).join("");
function startFlow(id){flow=DATA.flows.find(f=>f.id===id);fi=0;showView("mapView");fit();$("#player").classList.add("on");$("#pTitle").textContent=flow.title;renderStep();}
window.startFlow=startFlow;
function renderStep(){
  const s=flow.steps[fi];$("#pNum").textContent=`step ${fi+1} / ${flow.steps.length}`;$("#pText").textContent=s.text;$("#pBar").style.width=((fi+1)/flow.steps.length*100)+"%";
  clearFocus();
  if(s.link&&LINK[s.link]){const l=LINK[s.link];unhide(l.kind);focusLink(s.link);animate(s.link,s.reverse);$("#pRoom").disabled=false;$("#pRoom").onclick=()=>openRoom(s.reverse?l.src:l.dst);}
  else if(s.node){svg.classList.add("focus");svg.querySelector(`.node[data-id="${CSS.escape(s.node)}"]`)?.classList.add("pulse");$("#pRoom").disabled=!ENT[s.node];$("#pRoom").onclick=()=>openRoom(s.node);}
}
$("#pNext").onclick=()=>{if(fi<flow.steps.length-1){fi++;renderStep();}else stopAuto();};
$("#pPrev").onclick=()=>{if(fi>0){fi--;renderStep();}};
$("#pClose").onclick=()=>{stopAuto();$("#player").classList.remove("on");clearFocus();if(anim)anim.dot.remove();};
$("#pPlay").onclick=()=>{if(auto){stopAuto();return;}$("#pPlay").textContent="❚❚ Pause";auto=setInterval(()=>{if(fi<flow.steps.length-1){fi++;renderStep();}else stopAuto();},2600);};
function stopAuto(){clearInterval(auto);auto=null;$("#pPlay").textContent="▶ Play";}

/* ───────── INTERVIEW ───────── */
$("#qaList").innerHTML=`<div><div class="sec-title">Interview questions</div><p class="sec-sub">Answer out loud first, then open the answer and press "Show me" to see it in your own system.</p></div>`+
  DATA.questions.map((q,i)=>`<div class="lcard"><details${i===0?" open":""}><summary>${esc(q.q)}</summary><div class="ans">${esc(q.a)}</div>
    ${q.show?`<button class="big" onclick='showMe(${JSON.stringify(q.show)})'>Show me ${q.show.flow?"(play scenario)":"(open room)"}</button>`:""}</details></div>`).join("");
function showMe(s){if(s.flow)startFlow(s.flow);else if(s.room){showView("mapView");openRoom(s.room);}else if(s.gate){openGate(s.gate);}}
window.showMe=showMe;

/* deep links: architecture.html#room=backend-deployment · #gate=L12 · #flow=predict */
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const [k,v]=h.split("=");
  if(k==="room"&&ENT[v])openRoom(v); else if(k==="gate"&&LINK[v])openGate(v); else if(k==="flow")startFlow(v);}
fromHash();
</script>
