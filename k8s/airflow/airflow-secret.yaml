apiVersion: v1
kind: Secret
metadata:
  name: airflow-secret
  namespace: melanoma-production
type: Opaque
stringData:
  # The following are base64 encoded values for the secrets. You can generate these using the command: echo -n 'your_value' | base64
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"   # service named postgres must exist
  AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-to-a-long-random-string"
  AIRFLOW_ADMIN_PASSWORD: "admin"
