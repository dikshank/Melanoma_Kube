# Airflow --UDP:8125--> statsd-exporter (converts StatsD -> Prometheus format)
# Prometheus --HTTP GET :9102/metrics--> statsd-exporter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsd-exporter
  namespace: melanoma-production
  labels:
    app: statsd-exporter

spec:
  replicas: 1
  selector:
    matchLabels:
      app: statsd-exporter
  template:
    metadata:
      labels:
        app: statsd-exporter
    spec:
      containers: 
        - name: statsd-exporter
          image: prom/statsd-exporter:v0.23.0
          args:
            - "--statsd.listen-udp=:8125"
            # FIXED: was --statsd.listen-tcp=:9102. That made the exporter listen for
            # StatsD-over-TCP on 9102, the same port its HTTP /metrics server uses
            # by default -> "address already in use". 9102 is the WEB port:
            - "--web.listen-address=:9102"
          ports:
            - containerPort: 8125
              protocol: UDP
            - containerPort: 9102
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9102
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  # FIXED: was "statsd-exporter-service". Airflow (STATSD_HOST in airflow-config)
  # and Prometheus (scrape target) both use the name "statsd-exporter", and a
  # Service's DNS name IS its metadata.name.
  name: statsd-exporter
  namespace: melanoma-production
  labels:
    app: statsd-exporter
spec:
  selector:
    app: statsd-exporter
  ports:
    - name: statsd
      port: 8125
      protocol: UDP
      targetPort: 8125
    - name: metrics
      port: 9102
      targetPort: 9102
