server {
    listen 80;
    # nginx's default is 1 MB, which rejects normal phone photos (3-5 MB) with HTTP 413
    # before they reach the backend. 20 MB covers full-resolution phone and ISIC images.
    client_max_body_size 20m;
    # A request can point to two kind of things in nginx either a file like /app.js or a folder /, if there is no matching routing then nginx treats the request as file
    # so any request joins root + request path to find the location
    # GET /app.js -> /usr/share/nginx/html/app.js -> send app.js
    root /usr/share/nginx/html;  
    index index.html;

    # $uri: The path of the current request 
    # compare $uri with all the location rules
    # browser does localhost:80/ -> docker port mapping -> frontend container, port 80 -> nginx
    # nginx records the path $uri = /
    # now nginx picks the location rule, since it has no proxy_pass nginx will handle it itself as files
    # now root + $uri happens -> /usr/share/nginx/html/ -> is this a file? NO, it's a folder, so this option fails, move on, 
    # second option $uri/, this asks is it a folder? yes, so now which file do I send for a folder, that is what index answres 
    # if nothing worked then treat is as it is asking for /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /predict {     
        proxy_pass http://backend:8000;   # in docker compose this has to be on the same network to be able to use the docker's DNS
    } # In minikube the network is flat so that is not a problem, but DNS resolution happens like this -> backend.<namespace>.svc.cluster.local, so namespaces are always in the DNS, so backend in namespace melanoma and and backend in namespace test are two different full names with different IPs, They never clash. But how will the shortname gets resolved? 
      # Every pod gets a small DNS settings like /etc/resolve.conf, that includes a search list: suffixes to try when you use a shortname. For a pod in namespace melanoma it looks like: search melanoma.svc.cluster.local svc.cluster.local cluster.local, So 
      # when nginx, in the melanoma namespace, looks up backend: try backend.melanoma.svc.cluster.local -> if found then use the IP else try the other suffixes which will fail in this case unless you write backend.<namespace> which will pass in the second try because coreDNS only creates Service names in one exact shape: <service>.<namespace>.svc.cluster.local)
      # So now the nginx.conf can stay the same for minikube as well as long as the nginx and backend are in the same namespace or if they are in different namespace we have to specify by using backend.<namespace>:port 
    location /feedback {
        proxy_pass http://backend:8000;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /ready {
        proxy_pass http://backend:8000;
    }

    location /metrics {
        proxy_pass http://backend:8000;
    }
}